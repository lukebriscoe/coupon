# Coupon — configuration
# Every threshold the selection engine uses lives here. No magic numbers in code.

# ── Competitions ──────────────────────────────────────────────
# The Odds API sport keys. Order controls display order on the coupon.
leagues:
  - key: soccer_epl
    name: Premier League
    short: PL
  - key: soccer_efl_champ
    name: Championship
    short: CH
  - key: soccer_england_league1
    name: League One
    short: L1
  - key: soccer_england_league2
    name: League Two
    short: L2

# ── Odds source ───────────────────────────────────────────────
odds:
  bookmaker: skybet          # Sky Bet is the basis for all recommendations
  region: uk
  odds_format: decimal
  cache_ttl_hours: 2         # prices move on Saturday morning
  monthly_credit_limit: 500  # free tier — used for the usage banner
  # Match result only. A credit is charged per market per league, and asking
  # for double_chance as well cost a credit a league while coming back empty on
  # every fixture — the feed simply doesn't carry it. Double Chance selections
  # are derived from these prices instead (see devig.derived_double_chance),
  # which is what was already happening. Halving this pays for a daily refresh.
  markets: [h2h]
  fallback_markets: [h2h]

# ── The 15:00 filter ──────────────────────────────────────────
kickoff:
  timezone: Europe/London
  hour: 15
  minute: 0

# ── Margin removal ────────────────────────────────────────────
devig:
  method: proportional       # proportional | shin

# ── Bet construction ──────────────────────────────────────────
# Stakes are per bet and total £20 a week:
#   banker £10 + 4/1+ acca £1 + double £5 + treble £4
stake: 10.0                  # fallback for any bet that doesn't set its own

banker:
  stake: 10.0
  min_probability: 0.60      # a banker must genuinely be odds-on to land
  min_odds: 1.50             # ...but must still pay something on a tenner

underdog_acca:
  stake: 1.0                 # long odds, tiny hit rate — stake it accordingly
  # Back a team when its OPPONENT is priced at 4/1 (5.00 decimal) or longer.
  opponent_min_odds: 5.00
  # This bet alone looks at the whole Saturday, not just 15:00. Broadcasters
  # lift the mismatches out into the 12:30 and 17:30 slots, so the 3pm window
  # is systematically the flattest games on the card and big underdogs rarely
  # appear in it. The other three bets stay at 15:00.
  all_kickoffs: true
  # Above this many legs the literal acca is a lottery, so also show a system bet.
  system_bet_threshold: 6
  # "any N from M" — N is this fraction of the legs, rounded down.
  system_bet_ratio: 0.7

double:
  stake: 5.0
  min_odds: 1.50             # below this the bet is not worth placing

# Constraints on individual legs inside a treble/fourfold/fivefold.
# Maximising joint probability against a combined-odds target is very nearly a
# self-cancelling objective, so without these the engine pads the bet with 1.01
# near-certainties and loads all the real risk onto a single longshot. Both
# floors keep every leg a selection you'd actually place — and most bookmakers
# won't count legs shorter than 1/5 towards an accumulator anyway.
accumulator_legs:
  min_odds: 1.20
  min_probability: 0.50   # every leg must be odds-on to count as confident

accumulators:
  - legs: 3
    name: Treble
    stake: 4.0
    min_odds: 3.0

# Markets eligible as banker, double and accumulator legs.
eligible_markets:
  - h2h
  - double_chance

double_chance:
  # Double Chance has three forms. "Team or Draw" (1X / X2) is a natural way to
  # back a side safely. The third, "Home or Away" (12), only loses on a draw —
  # placeable, but it's a bet against one outcome rather than a pick, it reads
  # as nonsense on a coupon, and it's the form our derived pricing is least
  # reliable on. Off by default.
  allow_home_or_away: false
