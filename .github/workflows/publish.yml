name: Publish coupon

# Builds the Saturday coupon and publishes it to GitHub Pages.
#
# The odds are fetched here rather than in the browser: the repo is public, so
# a key shipped to the client would be readable by anyone. ODDS_API_KEY lives
# in repository secrets and never leaves the runner — only rendered HTML does.
#
# Cron is UTC and the UK is not, so the Saturday build runs at 08:30 UTC. That
# is 09:30 BST in summer and 08:30 GMT in winter — comfortably before a 15:00
# kick-off either way.
#
# It also runs on weekdays. Odds move all week, and building only at the
# weekend left the site showing Sunday's prices until the following Saturday
# while looking perfectly current. Settlement is free on days with nothing
# pending — it returns before making a request — so a weekday run costs only
# the four odds credits.

on:
  schedule:
    # Three attempts on Saturday morning. GitHub queues scheduled workflows on
    # shared runners and can start them hours late — the 08:30 build on
    # 29 August 2026 did not begin until 13:55, five minutes before kick-off,
    # and rewrote the coupon under a bet that had already been placed. Starting
    # at 05:00 leaves room for that delay, and the extra attempts cost four
    # credits each. The ledger lock is the real protection; this just makes it
    # far likelier a fresh slip is recorded before the lock closes at 10:00.
    - cron: '0 5 * * 6'
    - cron: '0 7 * * 6'
    - cron: '30 8 * * 6'
    # Saturday night — settle the day's results rather than waiting for
    # Sunday. The scores feed lags: at 16:55 the 15:00 games still had
    # completed=false with live scores showing. 21:30 UTC clears a 17:30
    # kick-off by hours, in BST or GMT.
    - cron: '30 21 * * 6'
    # Sunday mirrors Saturday: morning attempts to record the Sunday banker
    # before the 10:00 ledger lock, then an evening settle. The morning runs
    # also mop up any Saturday bet the night before could not resolve.
    - cron: '0 6 * * 0'
    - cron: '0 8 * * 0'
    - cron: '30 21 * * 0'
    - cron: '0 7 * * 1-5'  # Weekdays — keep the weekend's prices fresh
  workflow_dispatch:        # ...or run it by hand from the Actions tab

permissions:
  contents: write   # commit the settled slip ledger back
  pages: write
  id-token: write

# Never let two publishes race; let a newer run supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fail early if the key is missing
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::error::ODDS_API_KEY secret is not set. Add it under" \
                 "Settings → Secrets and variables → Actions. Without it the" \
                 "build would publish demo prices as if they were real."
            exit 1
          fi

      - name: Settle bets from previous Saturdays
        run: python -m football.settle

      - name: Build the static site
        run: python freeze.py --output _site --prefix /coupon

      - name: Commit the settled ledger
        run: |
          if [ -n "$(git status --porcelain data/slips.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/slips.json
            git commit -m "Update slip ledger [skip ci]"
            git push
          else
            echo "Ledger unchanged."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
